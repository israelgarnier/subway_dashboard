name: Actualizar datos Subway

on:
  schedule:
    # Costa Rica = UTC-6. 7:00 y 17:00 CR -> 13:00 y 23:00 UTC.
    - cron: "0 13,23 * * *"
  workflow_dispatch: {} # botón "Run workflow" para correr manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obtener noticias de Apify y generar data.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: andok~google-news-scraper
        run: node scripts/fetch.mjs

      - name: Commit y push de data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "chore: actualizar datos Subway ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
