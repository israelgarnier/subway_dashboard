name: Actualizar datos Subway

on:
  schedule:
    # Cada hora: Meltwater se refresca siempre; Apify (Google News + Facebook)
    # solo en las horas 01, 13 y 19 UTC (7pm, 7am, 1pm CR) para controlar costo.
    - cron: "0 * * * *"
  workflow_dispatch: {} # "Run workflow" = refresco COMPLETO (incluye Apify)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obtener datos (Meltwater + Apify) y generar data.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: andok~google-news-scraper
          MELTWATER_TOKEN: ${{ secrets.MELTWATER_TOKEN }}
          MELTWATER_SEARCH_ID: "28806749"
          FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/fetch.mjs

      - name: Commit y push de data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "chore: actualizar datos Subway ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
