<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compra de Subway · Monitoreo de medios · SHIFT</title>
<style>
  :root {
    /* Branding SHIFT LATAM · Porter Novelli */
    --brand:#0E7C5A; --brand-dark:#0A5F45; --brand-soft:#D1FAE5; --ink:#1a1a1a;
    --bg:#eef2f1; --panel:#ffffff; --panel-2:#f3f7f5; --border:#dce5e1;
    --text:#0f1e1a; --muted:#5b7066;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--brand-dark); text-decoration:none; font-weight:500; } a:hover { text-decoration:underline; }

  /* Cabecera de marca (logo real) */
  .topbar { background:#fff; border-bottom:3px solid var(--brand); }
  .topbar-inner { max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .logo-shift { height:40px; width:auto; display:block; }
  .logo-fallback { display:none; align-items:baseline; gap:10px; }
  .logo-fallback .mark { font-size:26px; font-weight:800; letter-spacing:1px; color:var(--ink); }
  .logo-fallback .agency { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  .topbar .ctx { font-size:12.5px; color:var(--muted); text-align:right; }

  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 64px; }
  .header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .title { font-size:24px; font-weight:800; letter-spacing:-0.3px; margin:0; color:var(--brand-dark); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .logo-subway { height:26px; width:auto; vertical-align:middle; }
  .subtitle { color:var(--muted); font-size:14px; margin:4px 0 0; }
  .updated { color:var(--muted); font-size:13px; text-align:right; } .updated b { color:var(--text); }

  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:22px 0; }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:0 1px 2px rgba(14,124,90,.04); }
  .kpi .num { font-size:30px; font-weight:800; line-height:1.1; color:var(--brand); }
  .kpi .lbl { color:var(--muted); font-size:12.5px; margin-top:6px; }

  .section { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; box-shadow:0 1px 2px rgba(14,124,90,.04); }
  .section h2 { font-size:16px; margin:0 0 14px; font-weight:700; color:var(--brand-dark); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .section.mw { border:2px solid var(--brand); box-shadow:0 3px 12px rgba(14,124,90,.10); }
  .section.mw h2 { font-size:17px; }

  .media-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .media { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .media .name { font-size:13.5px; font-weight:600; } .media .dom { font-size:11px; color:var(--muted); }
  .badge { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.yes { background:var(--brand-soft); color:var(--brand-dark); border:1px solid rgba(14,124,90,.3); }
  .badge.no { background:#eef1f0; color:var(--muted); border:1px solid var(--border); }

  .timeline { display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:8px; overflow-x:auto; }
  .bar-wrap { flex:1 0 66px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { width:100%; max-width:46px; background:linear-gradient(180deg,var(--brand),var(--brand-dark)); border-radius:6px 6px 0 0; min-height:4px; }
  .bar-day { font-size:11px; color:var(--text); white-space:nowrap; text-align:center; font-weight:600; }
  .bar-num { font-size:12px; font-weight:700; color:var(--brand-dark); }

  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.medium { white-space:nowrap; font-weight:600; color:var(--brand-dark); } td.date { white-space:nowrap; color:var(--muted); font-size:12.5px; }
  .src { margin-top:3px; } .src a { font-size:11.5px; color:var(--muted); font-weight:400; word-break:break-all; } .src a:hover { color:var(--brand-dark); }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--brand-soft); border:1px solid rgba(14,124,90,.3); color:var(--brand-dark); }

  /* Facebook */
  .fb-post { border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px; background:var(--panel-2); }
  .fb-post.rel { border-left:4px solid var(--brand); background:#fff; }
  .fb-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .fb-text { font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .fb-tag { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--brand-soft); color:var(--brand-dark); border:1px solid rgba(14,124,90,.3); }

  .empty { color:var(--muted); font-size:14px; padding:14px 0; }
  .toggle { background:none; border:none; color:var(--brand-dark); cursor:pointer; font-size:13px; padding:0; margin-top:4px; font-weight:600; }
  .foot { color:var(--muted); font-size:12.5px; margin-top:24px; }
  @media (max-width:720px){ .kpis{grid-template-columns:repeat(2,1fr);} .media-grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <img class="logo-shift" src="logo-shift.png" alt="SHIFT LATAM · Porter Novelli"
         onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';" />
    <div class="logo-fallback" id="logoFallback">
      <span class="mark">SHIFT</span><span class="agency">LATAM · Porter Novelli</span>
    </div>
    <div class="ctx">Monitoreo de medios · Costa Rica</div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="header">
    <div>
      <h1 class="title">Compra de
        <img class="logo-subway" src="logo-subway.png" alt="Subway"
             onerror="this.replaceWith(document.createTextNode('Subway'));" />
      </h1>
      <p class="subtitle">Cobertura sobre la adquisición de la franquicia Subway en Costa Rica
        (Coprocom · Subs Empire Foods · Grupo Subs CFA) en los 12 medios principales + Facebook de Coprocom.</p>
    </div>
    <div class="updated">Actualizado: <b id="updated">…</b></div>
  </div>
  <div id="content"><p class="empty">Cargando datos…</p></div>
</div>

<script>
function fmtDate(iso){ if(!iso) return "—"; try { return new Date(iso).toLocaleDateString("es-CR",{day:"2-digit",month:"short",year:"numeric"}); } catch { return String(iso).slice(0,10); } }
function fmtDateTime(iso){ if(!iso) return "—"; try { return new Date(iso).toLocaleString("es-CR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return iso; } }
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtReach(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M"; if(n>=1e3) return Math.round(n/1e3)+"K"; return String(n); }

function render(d){
  document.getElementById("updated").textContent = fmtDate(d.meta && d.meta.lastRunAt);
  const maxBar = d.timeline.length ? Math.max(...d.timeline.map(t=>t.count)) : 0;
  let html = "";

  const mw = d.meltwater || {relevantCount:0,totalReach:0,mentions:[]};
  const k = d.kpis || {};
  const latestDate = (mw.mentions[0] && mw.mentions[0].date) || k.latestDate;
  html += '<div class="kpis">' +
    kpi(mw.relevantCount, "Menciones del caso (Meltwater)") +
    kpi(fmtReach(mw.totalReach), "Alcance potencial") +
    kpi((k.mediaCovered||0) + ' <span style="font-size:16px;color:var(--muted)">/ '+(k.mediaTotal||12)+'</span>', "Medios (de 12) que cubrieron") +
    kpi('<span style="font-size:20px">'+fmtDate(latestDate)+'</span>', "Último artículo") +
  '</div>';

  // Meltwater — fuente principal, resaltada
  html += '<div class="section mw"><h2>📊 Meltwater · Compra subway <span class="pill">datos al cierre del monitoreo</span></h2>';
  if(mw.mentions.length){
    html += '<table><thead><tr><th>Medio</th><th>Titular</th><th>Alcance</th><th>Fecha</th></tr></thead><tbody>';
    mw.mentions.forEach(m=>{
      html += '<tr><td class="medium">'+esc(m.publisher)+'</td>'+
        '<td><a href="'+esc(m.url)+'" target="_blank" rel="noreferrer">'+esc(m.title)+' ↗</a></td>'+
        '<td class="date" title="Alcance potencial">'+(m.reach?('👁 '+fmtReach(m.reach)):'—')+'</td>'+
        '<td class="date">'+fmtDate(m.date)+'</td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="empty">Sin menciones del caso Subway en la búsqueda de Meltwater por ahora.</div>';
  }
  html += '</div>';

  // Cobertura 12 medios
  html += '<div class="section"><h2>Cobertura en los 12 medios principales</h2><div class="media-grid">';
  for(const m of d.coverage){
    html += '<div class="media"><div><div class="name">'+esc(m.name)+'</div><div class="dom">'+esc(m.domain)+'</div></div>'+
      '<div class="badge '+(m.covered?"yes":"no")+'" title="'+(m.latest?"Último: "+fmtDate(m.latest):"")+'">'+(m.covered?("✓ "+m.count):"—")+'</div></div>';
  }
  html += '</div></div>';

  // Línea de tiempo (año-mes-día)
  if(d.timeline.length){
    html += '<div class="section"><h2>Línea de tiempo de la cobertura</h2><div class="timeline">';
    for(const t of d.timeline){
      const h = maxBar>0 ? Math.max(6,(t.count/maxBar)*100) : 6;
      const [y,mo,da] = t.day.split("-");
      html += '<div class="bar-wrap"><div class="bar-num">'+t.count+'</div><div class="bar" style="height:'+h+'px"></div>'+
        '<div class="bar-day">'+da+'/'+mo+'/'+y+'</div></div>';
    }
    html += '</div></div>';
  }

  // Artículos 12 medios (con URL visible)
  html += '<div class="section"><h2>Artículos en los 12 medios principales</h2>';
  html += d.top12Articles.length ? table(d.top12Articles, true) : '<div class="empty">Aún no hay artículos de los 12 medios sobre la compra.</div>';
  html += '</div>';

  // Facebook Coprocom
  if(d.facebook){
    const posts = d.facebook.posts || [];
    const rel = posts.filter(p=>p.relevant);
    html += '<div class="section"><h2>Facebook · Coprocom <a href="'+esc(d.facebook.pageUrl)+'" target="_blank" rel="noreferrer">@Coprocom ↗</a></h2>';
    if(rel.length){
      html += '<p class="subtitle" style="margin:0 0 10px">Posts de Coprocom sobre el caso Subway:</p>';
      rel.forEach(p=>html+=fbCard(p));
    } else {
      html += '<div class="empty">Sin publicaciones de Coprocom sobre el caso Subway por ahora. Se revisan automáticamente '+posts.length+' posts recientes y aparecerán aquí en cuanto Coprocom mencione el caso.</div>';
    }
    html += '</div>';
  }

  // Otros medios
  if(d.otherArticles.length){
    html += '<div class="section"><h2>Otros medios <span class="pill">'+d.otherArticles.length+'</span></h2>'+
      '<button class="toggle" onclick="toggleOthers()">Mostrar / ocultar cobertura fuera de los 12</button>'+
      '<div id="others" style="display:none;margin-top:12px">'+table(d.otherArticles,false)+'</div></div>';
  }

  document.getElementById("content").innerHTML = html;
}

function kpi(num,lbl){ return '<div class="kpi"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
function table(rows, useMediumName){
  let h = '<table><thead><tr><th>Medio</th><th>Titular</th><th>Fecha</th></tr></thead><tbody>';
  for(const a of rows){
    const medio = useMediumName ? esc(a.mediumName) : esc(a.publisher);
    h += '<tr><td class="medium">'+medio+'</td>'+
      '<td><a href="'+esc(a.link)+'" target="_blank" rel="noreferrer" title="Abrir noticia">'+esc(a.title)+' ↗</a></td>'+
      '<td class="date">'+fmtDate(a.date)+'</td></tr>';
  }
  return h + '</tbody></table>';
}
function fbCard(p){
  const txt = p.text.length>320 ? esc(p.text.slice(0,320))+'…' : esc(p.text);
  return '<div class="fb-post'+(p.relevant?' rel':'')+'">'+
    '<div class="fb-meta"><span>📅 '+fmtDate(p.date)+'</span>'+
    '<span>👍 '+(p.reactions||0)+'</span><span>🔁 '+(p.shares||0)+'</span>'+
    (p.relevant?'<span class="fb-tag">Caso Subway</span>':'')+
    '<a href="'+esc(p.url)+'" target="_blank" rel="noreferrer">Ver post ↗</a></div>'+
    '<div class="fb-text">'+txt+'</div></div>';
}
function toggleOthers(){ const e=document.getElementById("others"); e.style.display = e.style.display==="none"?"block":"none"; }
function toggleFb(){ const e=document.getElementById("fbOtros"); e.style.display = e.style.display==="none"?"block":"none"; }

fetch("./data.json?_="+Date.now())
  .then(r=>{ if(!r.ok) throw new Error("data.json no disponible aún"); return r.json(); })
  .then(render)
  .catch(e=>{ document.getElementById("content").innerHTML = '<div class="empty">No hay datos todavía. Corre el workflow <b>Actualizar datos Subway</b> en la pestaña Actions de GitHub.<br><small>'+esc(e.message)+'</small></div>'; });
</script>
</body>
</html>
