<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compra de Subway · Monitoreo de medios · SHIFT</title>
<style>
  :root {
    /* Branding SHIFT Porter Novelli */
    --brand:#0E7C5A; --brand-dark:#0A5F45; --brand-soft:#D1FAE5;
    --bg:#eef2f1; --panel:#ffffff; --panel-2:#f3f7f5; --border:#dce5e1;
    --text:#0f1e1a; --muted:#5b7066; --green:#0E7C5A;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--brand-dark); text-decoration:none; font-weight:500; } a:hover { text-decoration:underline; }

  /* Cabecera de marca */
  .topbar { background:var(--brand); color:#fff; }
  .topbar-inner { max-width:1100px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .logo { display:flex; align-items:baseline; gap:10px; }
  .logo .mark { font-size:26px; font-weight:800; letter-spacing:1px; color:#fff; }
  .logo .mark span { color:var(--brand-soft); }
  .logo .agency { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.8); }
  .topbar .ctx { font-size:12.5px; color:rgba(255,255,255,.85); text-align:right; }

  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 64px; }
  .header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .title { font-size:24px; font-weight:800; letter-spacing:-0.3px; margin:0; color:var(--brand-dark); }
  .subtitle { color:var(--muted); font-size:14px; margin:4px 0 0; }
  .updated { color:var(--muted); font-size:13px; text-align:right; } .updated b { color:var(--text); }

  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:22px 0; }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:0 1px 2px rgba(14,124,90,.04); }
  .kpi .num { font-size:30px; font-weight:800; line-height:1.1; color:var(--brand); }
  .kpi .lbl { color:var(--muted); font-size:12.5px; margin-top:6px; }

  .section { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; box-shadow:0 1px 2px rgba(14,124,90,.04); }
  .section h2 { font-size:16px; margin:0 0 14px; font-weight:700; color:var(--brand-dark); }

  .media-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .media { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .media .name { font-size:13.5px; font-weight:600; } .media .dom { font-size:11px; color:var(--muted); }
  .badge { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.yes { background:var(--brand-soft); color:var(--brand-dark); border:1px solid rgba(14,124,90,.3); }
  .badge.no { background:#eef1f0; color:var(--muted); border:1px solid var(--border); }

  .timeline { display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:8px; }
  .bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .bar { width:100%; max-width:42px; background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    border-radius:6px 6px 0 0; min-height:4px; }
  .bar-day { font-size:10.5px; color:var(--muted); white-space:nowrap; } .bar-num { font-size:11px; font-weight:700; color:var(--brand-dark); }

  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.medium { white-space:nowrap; font-weight:600; color:var(--brand-dark); } td.date { white-space:nowrap; color:var(--muted); font-size:12.5px; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--brand-soft); border:1px solid rgba(14,124,90,.3); color:var(--brand-dark); }
  .empty { color:var(--muted); font-size:14px; padding:14px 0; }
  .toggle { background:none; border:none; color:var(--brand-dark); cursor:pointer; font-size:13px; padding:0; margin-top:4px; font-weight:600; }
  .foot { color:var(--muted); font-size:12.5px; margin-top:24px; }
  @media (max-width:720px){ .kpis{grid-template-columns:repeat(2,1fr);} .media-grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <!-- Para usar el logo oficial: reemplaza este bloque por <img src="logo.png" height="34" alt="SHIFT"> -->
    <div class="logo">
      <span class="mark">shift<span>.</span></span>
      <span class="agency">Porter Novelli</span>
    </div>
    <div class="ctx">Monitoreo de medios · Costa Rica</div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="header">
    <div>
      <h1 class="title">🥪 Compra de Subway</h1>
      <p class="subtitle">Cobertura sobre la adquisición de la franquicia Subway en Costa Rica
        (Coprocom · Subs Empire Foods · Grupo Subs CFA) en los 12 medios principales.</p>
    </div>
    <div class="updated">Actualizado: <b id="updated">…</b></div>
  </div>
  <div id="content"><p class="empty">Cargando datos…</p></div>
</div>

<script>
function fmtDate(iso){ if(!iso) return "—"; try { return new Date(iso).toLocaleDateString("es-CR",{day:"2-digit",month:"short",year:"numeric"}); } catch { return String(iso).slice(0,10); } }
function fmtDateTime(iso){ if(!iso) return "—"; try { return new Date(iso).toLocaleString("es-CR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch { return iso; } }
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(d){
  document.getElementById("updated").textContent = fmtDateTime(d.meta && d.meta.lastRunAt);
  const maxBar = d.timeline.length ? Math.max(...d.timeline.map(t=>t.count)) : 0;
  let html = "";

  html += '<div class="kpis">' +
    kpi(d.kpis.totalRelevant, "Notas sobre la compra") +
    kpi(d.kpis.mediaCovered + ' <span style="font-size:16px;color:var(--muted)">/ '+d.kpis.mediaTotal+'</span>', "Medios (de 12) que cubrieron") +
    kpi(d.kpis.top12Count, "Notas en los 12 principales") +
    kpi('<span style="font-size:20px">'+fmtDate(d.kpis.latestDate)+'</span>', "Último artículo") +
  '</div>';

  html += '<div class="section"><h2>Cobertura en los 12 medios principales</h2><div class="media-grid">';
  for(const m of d.coverage){
    html += '<div class="media"><div><div class="name">'+esc(m.name)+'</div><div class="dom">'+esc(m.domain)+'</div></div>'+
      '<div class="badge '+(m.covered?"yes":"no")+'" title="'+(m.latest?"Último: "+fmtDate(m.latest):"")+'">'+(m.covered?("✓ "+m.count):"—")+'</div></div>';
  }
  html += '</div></div>';

  if(d.timeline.length){
    html += '<div class="section"><h2>Línea de tiempo de la cobertura</h2><div class="timeline">';
    for(const t of d.timeline){
      const h = maxBar>0 ? Math.max(6,(t.count/maxBar)*90) : 6;
      html += '<div class="bar-wrap"><div class="bar-num">'+t.count+'</div><div class="bar" style="height:'+h+'px"></div><div class="bar-day">'+t.day.slice(5)+'</div></div>';
    }
    html += '</div></div>';
  }

  html += '<div class="section"><h2>Artículos en los 12 medios principales</h2>';
  if(!d.top12Articles.length){ html += '<div class="empty">Aún no hay artículos de los 12 medios sobre la compra.</div>'; }
  else { html += table(d.top12Articles, true); }
  html += '</div>';

  if(d.otherArticles.length){
    html += '<div class="section"><h2>Otros medios <span class="pill">'+d.otherArticles.length+'</span></h2>'+
      '<button class="toggle" onclick="toggleOthers()">Mostrar / ocultar cobertura fuera de los 12</button>'+
      '<div id="others" style="display:none;margin-top:12px">'+table(d.otherArticles,false)+'</div></div>';
  }

  html += '<p class="foot">Fuente: Google News vía Apify ('+esc(d.meta&&d.meta.source||"")+'). Actualización automática vía GitHub Actions. · <b>SHIFT Porter Novelli</b></p>';
  document.getElementById("content").innerHTML = html;
}

function kpi(num,lbl){ return '<div class="kpi"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
function table(rows, useMediumName){
  let h = '<table><thead><tr><th>Medio</th><th>Titular</th><th>Fecha</th></tr></thead><tbody>';
  for(const a of rows){
    const medio = useMediumName ? esc(a.mediumName) : esc(a.publisher);
    h += '<tr><td class="medium">'+medio+'</td><td><a href="'+esc(a.link)+'" target="_blank" rel="noreferrer">'+esc(a.title)+'</a></td><td class="date">'+fmtDate(a.date)+'</td></tr>';
  }
  return h + '</tbody></table>';
}
function toggleOthers(){ const e=document.getElementById("others"); e.style.display = e.style.display==="none" ? "block" : "none"; }

fetch("./data.json?_="+Date.now())
  .then(r=>{ if(!r.ok) throw new Error("data.json no disponible aún"); return r.json(); })
  .then(render)
  .catch(e=>{ document.getElementById("content").innerHTML = '<div class="empty">No hay datos todavía. Corre el workflow <b>Actualizar datos Subway</b> en la pestaña Actions de GitHub.<br><small>'+esc(e.message)+'</small></div>'; });
</script>
</body>
</html>
